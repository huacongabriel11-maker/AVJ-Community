<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AVJ Community - Tienda de Streaming y Servicios Premium">
    <title>⚡ AVJ COMMUNITY ⚡</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QK7ZD8WKXY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QK7ZD8WKXY');
    </script>
    <style>
        :root { --bg-main: #060913; --bg-card: #0f1526; --bg-nav: rgba(6, 9, 19, 0.85); --primary: #3b82f6; --text-muted: #94a3b8; --neon-green: #4ade80; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-main); color: #fff; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: var(--bg-nav); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .logo { font-size: 18px; font-weight: 900; color: var(--primary); text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; padding: 20px 5%; }
        .card { background: var(--bg-card); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .stock-badge { color: var(--neon-green); font-size: 12px; font-weight: bold; margin-bottom: 10px; display: block; }
        .buy { width: 100%; padding: 12px; background: var(--primary); border: none; color: white; border-radius: 10px; cursor: pointer; margin-top: 10px; }
        .social-proof-popup { position: fixed; bottom: 20px; left: -350px; background: #0f1526; border: 1px solid var(--primary); padding: 12px; border-radius: 12px; z-index: 9999; transition: left 0.5s; width: 280px; }
        .social-proof-popup.active { left: 20px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">AVJ COMMUNITY</div>
        <button class="cart-btn" onclick="openCart()">Carrito (<span id="count">0</span>)</button>
    </header>

    <div id="social-proof" class="social-proof-popup">
        <div id="social-proof-text" style="font-size: 12px; color: white;"></div>
    </div>

    <section class="grid" id="catalog">
        </section>

    <script>
        // BASE DE DATOS Y GESTIÓN DE STOCK
        const productos = [
            { id: 1, name: "Netflix UHD", price: 4.50, stock: 2 },
            { id: 2, name: "Disney Bundle", price: 3.50, stock: 2 },
            { id: 3, name: "Paramount+", price: 3.00, stock: 2 },
            { id: 4, name: "Max (HBO)", price: 3.50, stock: 2 },
            { id: 5, name: "YouTube Premium", price: 4.50, stock: 2 },
            { id: 6, name: "Spotify Premium", price: 3.50, stock: 2 },
            { id: 7, name: "Gemini + 5TB", price: 12.00, stock: 2 },
            { id: 8, name: "ChatGPT PLUS", price: 7.00, stock: 2 },
            { id: 9, name: "Crunchyroll Mes", price: 3.50, stock: 2 },
            { id: 10, name: "Crunchyroll Año", price: 10.00, stock: 2 },
            { id: 11, name: "Steam Balance", price: 5.00, stock: 2 },
            { id: 12, name: "NordVPN", price: 3.00, stock: 2 }
        ];

        let cart = [];

        function renderCatalog() {
            const container = document.getElementById('catalog');
            container.innerHTML = productos.map(p => `
                <div class="card">
                    <h3>${p.name}</h3>
                    <span class="stock-badge">STOCK: ${p.stock} UNIDADES</span>
                    <div class="price">$${p.price.toFixed(2)}</div>
                    <button class="buy" ${p.stock <= 0 ? 'disabled' : ''} onclick="addToCart(${p.id})">
                        ${p.stock > 0 ? 'Agregar al carrito' : 'Agotado'}
                    </button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const p = productos.find(x => x.id === id);
            if(p.stock > 0) {
                p.stock--;
                cart.push(p);
                document.getElementById("count").innerText = cart.length;
                renderCatalog();
                alert(p.name + " agregado. Quedan " + p.stock);
            }
        }

        function initSocialProof() {
            const clientes = ["Alejandro", "Bryan", "Katherine", "Mateo"];
            setInterval(() => {
                const nombre = clientes[Math.floor(Math.random() * clientes.length)];
                document.getElementById("social-proof-text").innerHTML = `<strong>${nombre}</strong> acaba de comprar una cuenta.`;
                document.getElementById("social-proof").classList.add("active");
                setTimeout(() => document.getElementById("social-proof").classList.remove("active"), 5000);
            }, 10000);
        }

        // ... (AQUÍ IRÍA TODA TU LÓGICA ORIGINAL DE FACTURACIÓN Y COMENTARIOS) ...

        renderCatalog();
        initSocialProof();
    </script>
</body>
</html>
