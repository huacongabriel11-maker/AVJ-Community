<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ AVJ COMMUNITY | Premium Digital Services ⚡</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QK7ZD8WKXY"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-QK7ZD8WKXY');
    </script>
    <style>
        /* CSS Integrado para alto rendimiento */
        :root { 
            --bg-main: #060913; --bg-card: #0f1526; --primary: #3b82f6; 
            --text-muted: #94a3b8; --neon-green: #4ade80; --accent: #a855f7;
        }
        body { background-color: var(--bg-main); color: #fff; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        /* Layout */
        header { padding: 20px 5%; background: rgba(6,9,19,0.9); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 20px; font-weight: 900; color: var(--primary); text-transform: uppercase; }
        
        /* Grid de Productos */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 40px 5%; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .card:hover { border-color: var(--primary); }
        .stock-badge { color: var(--neon-green); font-size: 12px; font-weight: bold; margin-bottom: 10px; display: block; }
        
        /* Botones */
        .buy-btn { width: 100%; padding: 12px; background: var(--primary); border: none; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; }
        
        /* Estilos de Factura y Carrito */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 5000; }
        .cart-box { width: 90%; max-width: 450px; background: var(--bg-card); padding: 30px; border-radius: 25px; }
        
        /* Animaciones */
        .hero { text-align: center; padding: 60px 20px; background: linear-gradient(to bottom, #0a1128, var(--bg-main)); }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-crown"></i> AVJ COMMUNITY</div>
        <button class="cart-btn" onclick="openCart()"><i class="fa-solid fa-cart-shopping"></i> (<span id="cart-count">0</span>)</button>
    </header>

    <section class="hero">
        <h1>Servicios Digitales Premium</h1>
        <p>Garantía, seguridad y entrega inmediata.</p>
    </section>

    <section class="products-grid" id="catalog">
        </section>

    <div id="modal" class="modal" onclick="closeCart()">
        <div class="cart-box" onclick="event.stopPropagation()">
            <div id="cart-content"></div>
        </div>
    </div>

    <script>
        const productos = [
            { id: 1, name: "Netflix UHD", price: 4.50, stock: 2, cat: "streaming" },
            { id: 2, name: "Disney Bundle", price: 3.50, stock: 2, cat: "streaming" },
            { id: 3, name: "Gemini + 5TB", price: 12.00, stock: 2, cat: "ia" },
            { id: 4, name: "ChatGPT PLUS", price: 7.00, stock: 2, cat: "ia" }
            // Puedes seguir añadiendo aquí todos tus productos para escalar el código
        ];

        let cart = [];

        function renderCatalog() {
            const container = document.getElementById('catalog');
            container.innerHTML = productos.map(p => `
                <div class="card">
                    <h3>${p.name}</h3>
                    <span class="stock-badge">STOCK: ${p.stock} UNIDADES</span>
                    <div class="price">$${p.price.toFixed(2)}</div>
                    <button class="buy-btn" onclick="addToCart(${p.id})">Agregar</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const p = productos.find(x => x.id === id);
            if(p.stock > 0) {
                cart.push(p);
                p.stock--;
                document.getElementById('cart-count').innerText = cart.length;
                renderCatalog();
            } else {
                alert("Producto agotado");
            }
        }

        function openCart() {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('cart-content').innerHTML = `
                <h2>Tu Pedido</h2>
                ${cart.map(i => `<p>${i.name} - $${i.price}</p>`).join('')}
                <button class="buy-btn" onclick="sendWhatsApp()">Finalizar en WhatsApp</button>
            `;
        }

        function closeCart() { document.getElementById('modal').style.display = 'none'; }

        function sendWhatsApp() {
            let msg = "¡Hola! Quiero comprar: " + cart.map(i => i.name).join(", ");
            window.open("https://wa.me/593986514739?text=" + encodeURIComponent(msg));
        }

        renderCatalog();
    </script>
</body>
</html>
