    carrito.forEach((producto, indice) => {
        totalMensual += producto.precio;

        div.style.display = 'flex';
        div.style.justifyContent = 'space-between';
        div.style.marginBottom = '10px';
        div.innerHTML = `
            <span>${producto.nombre} - $${producto.precio.toFixed(2)}/mes</span>
            <button onclick="eliminarDelCarrito(${indice})" style="background-color: #ff4d4d; color: white; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer;">X</button>
        `;
        contenedor.appendChild(div);
    });

    const meses = parseInt(document.getElementById('meses').value) || 1;
    const totalNeto = totalMensual * meses;

    document.getElementById('total-precio').innerText = totalNeto.toFixed(2);
            }

    <script>
        let cart = []; let selectedRating = 5;
        function switchTab(tabName) {
            document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
            document.querySelectorAll(".tab-link").forEach(b => b.classList.remove("active"));
            document.getElementById(`tab-content-${tabName}`).classList.add("active");
            document.getElementById(`tab-btn-${tabName}`).classList.add("active");
        }
        function add(name, price) { cart.push({ id: Date.now() + Math.random(), name, price }); update(); }
        function removeItem(id) { cart = cart.filter(item => item.id !== id); update(); }
        function clearCart() { cart = []; backToCart(); update(); }
        function update() {
            document.getElementById("count").innerText = cart.length; let html = "";
            if (cart.length === 0) { html = `<div class="empty-cart-text">El carrito está vacío</div>`; } 
            else { cart.forEach(x => { html += `<div class="item"><div class="item-details"><span class="item-name">${x.name}</span><span class="item-price">$${x.price.toFixed(2)}</span></div><button class="remove-item" onclick="removeItem(${x.id})"><i class="fa-solid fa-trash-can"></i></button></div>`; }); }
            document.getElementById("items").innerHTML = html;
        }
        window.onload = function () {
            document.getElementById("google-login-btn").innerHTML = `<button onclick="startFakeLogin()" style="background:#fff; color:#1f2937; border:none; padding:8px 16px; border-radius:20px; font-weight:600; font-size:13px; display:flex; align-items:center; gap:8px; cursor:pointer;"><img src='https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_\"G\"_logo.svg' style='width:16px;'> Iniciar con Google</button>`;
        }
        function startFakeLogin() {
            let email = prompt("Introduce tu correo de Gmail:");
            if (email && email.includes("@")) {
                let nom = email.split("@")[0]; nom = nom.charAt(0).toUpperCase() + nom.slice(1);
                document.getElementById("google-login-btn").style.display = "none";
                document.getElementById("user-avatar").src = "https://ui-avatars.com/api/?name=" + nom + "&background=3b82f6&color=fff";
                document.getElementById("user-name").innerText = "Hola, " + nom;
                document.getElementById("user-profile").style.display = "flex";
                if(document.getElementById("review-name")) document.getElementById("review-name").value = nom;
            }
        }
        function logout() { document.getElementById("user-profile").style.display = "none"; document.getElementById("google-login-btn").style.display = "block"; }
        function goToInvoice() {
            if(cart.length === 0) return alert("Carrito vacío"); let invoiceHtml = "";
            cart.forEach(x => { invoiceHtml += `<div class="invoice-line"><span>📦 ${x.name}</span><span style="color:#3b82f6">$${x.price.toFixed(2)}</span></div>`; });
            document.getElementById("invoice-products-list").innerHTML = invoiceHtml;
            document.getElementById("cart-view-items").style.display = "none"; document.getElementById("cart-view-invoice").style.display = "block";
        }
        function backToCart() { document.getElementById("cart-view-invoice").style.display = "none"; document.getElementById("cart-view-items").style.display = "block"; }
        function sendWhatsApp() {
            let message = "¡Hola AVJ COMMUNITY! 👋 Acabo de revisar mi factura. Deseo adquirir:\n\n";
            cart.forEach((x, index) => { message += `${index + 1}. 📦 *${x.name}* - $${x.price.toFixed(2)}\n`; });
            message += `\n-------------------------\n📅 *Total neto mensual:* $1.50\n\nAdjunto comprobante. ¿Verifican los accesos?`;
            window.open(`https://wa.me/593986514739?text=${encodeURIComponent(message)}`, '_blank');
        }
        function setRating(r) { selectedRating = r; document.querySelectorAll(".stars-input i").forEach((s, idx) => { if (idx < r) { s.classList.add("active"); } else { s.classList.remove("active"); } }); }
        function submitReview() {
            const n = document.getElementById("review-name").value.trim(), t = document.getElementById("review-text").value.trim(); if(!n || !t) return alert("Completa los campos.");
            let sh = ""; for(let i=0; i<5; i++) sh += i < selectedRating ? `<i class="fa-solid fa-star"></i>` : `<i class="fa-regular fa-star"></i>`;
            const b = document.createElement("div"); b.className = "review-box"; b.innerHTML = `<div class="review-header"><strong>${n}</strong><div>${sh}</div></div><p>${t}</p>`;
            document.getElementById("reviews-list").insertBefore(b, document.getElementById("reviews-list").firstChild);
            document.getElementById("review-name").value = ""; document.getElementById("review-text").value = ""; setRating(5);
        }
        function openCart() { backToCart(); document.getElementById("modal").style.display = "flex"; }
        function closeCart() { document.getElementById("modal").style.display = "none"; }
        setRating(5); update();
    </script>
</body>
</html>
